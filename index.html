<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tennis Court Tracker & Expense Calculator</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        .collapsible-content { max-height: 2000px; transition: max-height 0.3s ease-out; overflow: hidden; }
        .collapsed { max-height: 0 !important; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen p-4">

    <div class="max-w-6xl mx-auto space-y-4">
        <header class="bg-blue-600 text-white p-4 rounded-xl shadow text-center">
            <h1 class="text-2xl font-bold">🎾 Tennis 4-Court Doubles Tracker</h1>
            <p class="text-sm opacity-90">Daily Slots (7:00 AM - 10:00 AM) & Ball Expense Splitter</p>
        </header>

        <!-- SECTION 1: CALENDAR VIEW -->
        <div class="bg-white rounded-xl shadow overflow-hidden">
            <button onclick="toggleSection('calendar-sec')" class="w-full bg-gray-200 p-4 text-left font-bold flex justify-between items-center cursor-pointer hover:bg-gray-300">
                <span>📅 Calendar & Views (Day / Week / Month)</span>
                <span id="calendar-sec-icon">▼</span>
            </button>
            <div id="calendar-sec" class="collapsible-content p-4 space-y-4">
                <div class="flex flex-wrap gap-2 justify-between items-center">
                    <input type="date" id="current-date" class="border p-2 rounded bg-gray-50" onchange="renderMatrix()">
                    <div class="inline-flex rounded-md shadow-xs">
                        <button class="bg-blue-600 text-white px-4 py-2 text-sm font-medium rounded-l-md">Day</button>
                        <button class="bg-white text-gray-700 px-4 py-2 text-sm font-medium border-t border-b border-gray-200 hover:bg-gray-50">Week</button>
                        <button class="bg-white text-gray-700 px-4 py-2 text-sm font-medium rounded-r-md border-t border-b border-r border-gray-200 hover:bg-gray-50">Month</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- SECTION 2: COURT MATRIX -->
        <div class="bg-white rounded-xl shadow overflow-hidden">
            <button onclick="toggleSection('matrix-sec')" class="w-full bg-gray-200 p-4 text-left font-bold flex justify-between items-center cursor-pointer hover:bg-gray-300">
                <span>⚔️ Court Daily Booking Matrix</span>
                <span id="matrix-sec-icon">▼</span>
            </button>
            <div id="matrix-sec" class="collapsible-content p-4 overflow-x-auto">
                <table class="w-full border-collapse min-w-[600px]">
                    <thead>
                        <tr class="bg-gray-100">
                            <th class="border p-2 text-left w-32">Time Slot</th>
                            <th class="border p-2 bg-blue-50 text-blue-800">Court 1</th>
                            <th class="border p-2 bg-green-50 text-green-800">Court 2</th>
                            <th class="border p-2 bg-yellow-50 text-yellow-800">Court 3</th>
                            <th class="border p-2 bg-purple-50 text-purple-800">Court 4</th>
                        </tr>
                    </thead>
                    <tbody id="matrix-body">
                        <!-- Generated Dynamically -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- SECTION 3: EXPENSE CALCULATOR -->
        <div class="bg-white rounded-xl shadow overflow-hidden">
            <button onclick="toggleSection('expense-sec')" class="w-full bg-gray-200 p-4 text-left font-bold flex justify-between items-center cursor-pointer hover:bg-gray-300">
                <span>💵 Tennis Ball Expense Calculator (End of Day/Month)</span>
                <span id="expense-sec-icon">▼</span>
            </button>
            <div id="expense-sec" class="collapsible-content p-4 space-y-4">
                <div class="flex flex-wrap gap-4 items-end bg-gray-50 p-4 rounded-lg">
                    <div>
                        <label class="block text-sm font-medium mb-1">Total Ball Cost (₹ / $)</label>
                        <input type="number" id="ball-cost" value="1200" class="border p-2 rounded w-32 bg-white">
                    </div>
                    <button onclick="calculateExpenses()" class="bg-emerald-600 text-white px-6 py-2 rounded-lg font-bold hover:bg-emerald-700 cursor-pointer">
                        Calculate Split
                    </button>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full border-collapse">
                        <thead>
                            <tr class="bg-gray-100">
                                <th class="border p-2 text-left">Player Name</th>
                                <th class="border p-2 text-center">Total Sets Played</th>
                                <th class="border p-2 text-right">Cost Share</th>
                            </tr>
                        </thead>
                        <tbody id="expense-body">
                            <tr><td colspan="3" class="text-center p-4 text-gray-500">Run calculation to view data.</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL FOR DIALOG/INPUT -->
    <div id="booking-modal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white p-6 rounded-xl max-w-md w-full shadow-2xl space-y-4">
            <h3 class="text-lg font-bold text-gray-900" id="modal-title">Enter Doubles Lineup</h3>
            <div class="space-y-2">
                <input type="text" id="p1" placeholder="Player 1 Name" class="w-full border p-2 rounded">
                <input type="text" id="p2" placeholder="Player 2 Name" class="w-full border p-2 rounded">
                <input type="text" id="p3" placeholder="Player 3 Name" class="w-full border p-2 rounded">
                <input type="text" id="p4" placeholder="Player 4 Name" class="w-full border p-2 rounded">
            </div>
            <div class="flex justify-end gap-2">
                <button onclick="closeModal()" class="px-4 py-2 border rounded hover:bg-gray-100 cursor-pointer">Cancel</button>
                <button onclick="saveBooking()" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 cursor-pointer">Confirm Entry</button>
            </div>
        </div>
    </div>

    <script>
        const slots = ["07:00 AM - 07:30 AM", "07:30 AM - 08:00 AM", "08:00 AM - 08:30 AM", "08:30 AM - 09:00 AM", "09:00 AM - 09:30 AM", "09:30 AM - 10:00 AM"];
        let db = JSON.parse(localStorage.getItem('tennis_db')) || {};
        let activeSlot = null, activeCourt = null;

        // Set default date picker to today
        document.getElementById('current-date').value = new Date().toISOString().split('T')[0];

        function toggleSection(id) {
            const el = document.getElementById(id);
            const icon = document.getElementById(id + '-icon');
            el.classList.toggle('collapsed');
            icon.innerText = el.classList.contains('collapsed') ? '►' : '▼';
        }

        function renderMatrix() {
            const date = document.getElementById('current-date').value;
            const body = document.getElementById('matrix-body');
            body.innerHTML = '';

            slots.forEach(slot => {
                let row = document.createElement('tr');
                row.innerHTML = `<td class="border p-2 font-medium bg-gray-50 text-xs">${slot}</td>`;
                
                for(let court=1; court<=4; court++) {
                    const key = `${date}_${slot}_C${court}`;
                    const players = db[key] || [];
                    let cellContent = '';
                    
                    if(players.length === 4) {
                        cellContent = `<div class="text-xs space-y-0.5 text-gray-700">
                            <strong>👥 Match Locked:</strong>
                            <div class="truncate">${players.join(', ')}</div>
                        </div>`;
                    } else {
                        cellContent = `<button onclick="openModal('${slot}', ${court})" class="text-xs text-blue-600 hover:underline w-full text-left py-2 font-medium">+ Enter 4 Players</button>`;
                    }
                    row.innerHTML += `<td class="border p-3 transition-colors hover:bg-gray-50">${cellContent}</td>`;
                }
                body.appendChild(row);
            });
        }

        function openModal(slot, court) {
            activeSlot = slot; activeCourt = court;
            const date = document.getElementById('current-date').value;
            const key = `${date}_${slot}_C${court}`;
            const existing = db[key] || [];
            
            document.getElementById('p1').value = existing[0] || '';
            document.getElementById('p2').value = existing[1] || '';
            document.getElementById('p3').value = existing[2] || '';
            document.getElementById('p4').value = existing[3] || '';
            
            document.getElementById('modal-title').innerText = `Court ${court} (${slot})`;
            document.getElementById('booking-modal').classList.remove('hidden');
        }

        function closeModal() { document.getElementById('booking-modal').classList.add('hidden'); }

        function saveBooking() {
            const date = document.getElementById('current-date').value;
            const key = `${date}_${activeSlot}_C${activeCourt}`;
            const p1 = document.getElementById('p1').value.trim();
            const p2 = document.getElementById('p2').value.trim();

const p3 = document.getElementById('p3').value.trim();
const p4 = document.getElementById('p4').value.trim();
if(!p1 || !p2 || !p3 || !p4) { alert("Please complete all 4 player entries for a doubles match."); return; }
db[key] = [p1, p2, p3, p4];
localStorage.setItem('tennis_db', JSON.stringify(db));
closeModal();
renderMatrix();
}
function calculateExpenses() {
const totalCost = parseFloat(document.getElementById('ball-cost').value) || 0;
let playerCounts = {}, totalSetsTracked = 0;
Object.values(db).forEach(players => {
players.forEach(p => {
playerCounts[p] = (playerCounts[p] || 0) + 1;
totalSetsTracked++;
});
});
const expenseBody = document.getElementById('expense-body');
expenseBody.innerHTML = '';
if (totalSetsTracked === 0) {
expenseBody.innerHTML = <tr><td colspan="3" class="text-center p-4 text-red-500">No active player sets found in the database. Add entries first.</td></tr>;
return;
}
Object.keys(playerCounts).sort().forEach(player => {
let sets = playerCounts[player];
let costShare = (sets / totalSetsTracked) * totalCost;
expenseBody.innerHTML += `
${player}
${sets}
₹${costShare.toFixed(2)}
`;
});
}
// Initialize layout on load
renderMatrix();
